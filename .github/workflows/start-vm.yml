name: Start Android 4.4 VM

on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: "How long to keep the VM running"
        required: true
        type: choice
        default: "120"
        options:
          - "30"
          - "60"
          - "120"
          - "180"
          - "240"
          - "300"
      root_access:
        description: "Enable ADB root access for this VM session"
        required: true
        type: choice
        default: "disabled"
        options:
          - "disabled"
          - "enabled"

permissions:
  contents: read

jobs:
  android-vm:
    name: Start Android VM
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate launcher scripts
        run: |
          bash -n scripts/start-vm.sh
          bash -n scripts/prepare-android-sdk.sh

      - name: Set up Java for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore Android SDK and KitKat image cache
        id: android-sdk-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.android-sdk
          key: ${{ runner.os }}-android-sdk-kitkat-google-apis-x86-v3
          restore-keys: |
            ${{ runner.os }}-android-sdk-kitkat-x86-

      - name: Prepare Android SDK and KitKat system image
        run: bash scripts/prepare-android-sdk.sh

      - name: Save Android SDK cache before VM session
        if: success() && steps.android-sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android-sdk
          key: ${{ runner.os }}-android-sdk-kitkat-google-apis-x86-v3

      - name: Start KitKat desktop and tunnel
        env:
          SESSION_MINUTES: ${{ inputs.session_minutes }}
          ROOT_ACCESS: ${{ inputs.root_access }}
          VM_ACCESS_PASSWORD: ${{ secrets.VM_ACCESS_PASSWORD }}
        run: bash scripts/start-vm.sh
