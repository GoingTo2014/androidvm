name: Start Android VM

on:
  workflow_dispatch:
    inputs:
      android_version:
        description: "Android release to run (KitKat is the default)"
        required: true
        type: choice
        default: "4.4 (API 19)"
        options:
          - "2.3.3 (API 10)"
          - "4.0.4 (API 15)"
          - "4.1 (API 16)"
          - "4.3 (API 18)"
          - "4.4 (API 19)"
          - "5.0 (API 21)"
          - "5.1 (API 22)"
          - "6.0 (API 23)"
          - "7.0 (API 24)"
      session_minutes:
        description: "How long to keep the VM running"
        required: true
        type: choice
        default: "120"
        options:
          - "30"
          - "60"
          - "120"
          - "180"
          - "240"
          - "300"
      device_mode:
        description: "Phone display or predefined Nexus 7 tablet hardware profile"
        required: true
        type: choice
        default: "phone"
        options:
          - "phone"
          - "tablet"
      hardware_keyboard:
        description: "Allow the computer's physical keyboard to type into Android"
        required: true
        type: choice
        default: "enabled"
        options:
          - "enabled"
          - "disabled"
      root_access:
        description: "Enable ADB root access for this VM session"
        required: true
        type: choice
        default: "disabled"
        options:
          - "disabled"
          - "enabled"
      vm_ram_mb:
        description: "Android RAM (MB)"
        required: true
        type: choice
        default: "2048"
        options:
          - "1536"
          - "2048"
          - "3072"
          - "4096"
      vm_cpu_cores:
        description: "Number of Android CPU cores"
        required: true
        type: choice
        default: "1"
        options:
          - "1"
          - "2"
          - "4"
      data_partition_size:
        description: "Android internal data storage size"
        required: true
        type: choice
        default: "2G"
        options:
          - "1G"
          - "2G"
          - "4G"
          - "8G"
      sd_card_enabled:
        description: "Attach a virtual SD card"
        required: true
        type: choice
        default: "disabled"
        options:
          - "disabled"
          - "enabled"
      sd_card_size:
        description: "Virtual SD card capacity (used when enabled)"
        required: true
        type: choice
        default: "1G"
        options:
          - "256M"
          - "512M"
          - "1G"
          - "2G"
          - "4G"
          - "8G"

permissions:
  contents: read

jobs:
  android-vm:
    name: Start Android VM
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate launcher scripts
        run: |
          bash -n scripts/start-vm.sh
          bash -n scripts/prepare-android-sdk.sh

      - name: Set up Java for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore Android SDK tools cache
        id: android-sdk-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.android-sdk/cmdline-tools
            ~/.android-sdk/platform-tools
            ~/.android-sdk/emulator
            ~/.android-sdk/licenses
          key: ${{ runner.os }}-android-sdk-tools-v1

      - name: Restore selected Android system image cache
        id: android-image-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.android-sdk/system-images
          key: ${{ runner.os }}-android-system-image-${{ inputs.android_version }}-v1

      - name: Prepare Android SDK and selected system image
        env:
          ANDROID_VERSION: ${{ inputs.android_version }}
        run: bash scripts/prepare-android-sdk.sh

      - name: Save Android SDK tools cache before VM session
        if: success() && steps.android-sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.android-sdk/cmdline-tools
            ~/.android-sdk/platform-tools
            ~/.android-sdk/emulator
            ~/.android-sdk/licenses
          key: ${{ runner.os }}-android-sdk-tools-v1

      - name: Save selected Android system image cache before VM session
        if: success() && steps.android-image-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android-sdk/system-images
          key: ${{ runner.os }}-android-system-image-${{ inputs.android_version }}-v1

      - name: Start selected Android desktop and tunnel
        env:
          ANDROID_VERSION: ${{ inputs.android_version }}
          SESSION_MINUTES: ${{ inputs.session_minutes }}
          ROOT_ACCESS: ${{ inputs.root_access }}
          VM_DEVICE_MODE: ${{ inputs.device_mode }}
          VM_HARDWARE_KEYBOARD: ${{ inputs.hardware_keyboard }}
          VM_ACCESS_PASSWORD: ${{ secrets.VM_ACCESS_PASSWORD }}
          VM_RAM_MB: ${{ inputs.vm_ram_mb }}
          VM_CPU_CORES: ${{ inputs.vm_cpu_cores }}
          VM_DATA_PARTITION_SIZE: ${{ inputs.data_partition_size }}
          VM_SD_CARD_ENABLED: ${{ inputs.sd_card_enabled }}
          VM_SD_CARD_SIZE: ${{ inputs.sd_card_size }}
        run: bash scripts/start-vm.sh
