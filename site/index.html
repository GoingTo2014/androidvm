<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>AndroidVM</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }
    #android-screen {
      position: fixed;
      inset: 0;
      display: block;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      margin: 0;
      padding: 0;
      border: 0;
      background: #000;
    }
    #audio { display: none; }
  </style>
</head>
<body>
  <iframe
    id="android-screen"
    title="Android 4.4 virtual device"
    src="/novnc/vnc.html?autoconnect=true&amp;resize=scale&amp;path=%2Fwebsockify&amp;quality=6&amp;compression=6"
    allow="autoplay; fullscreen; clipboard-read; clipboard-write"
  ></iframe>
  <audio id="audio" autoplay preload="auto" src="/audio.mp3" aria-hidden="true"></audio>
  <script>
    const frame = document.getElementById("android-screen");
    const audio = document.getElementById("audio");
    let audioPlaying = false;

    async function tryStartAudio() {
      if (audioPlaying || !audio.paused) return;
      try {
        await audio.play();
        audioPlaying = !audio.paused;
      } catch (_) {
        // Chrome may block audible autoplay until the user interacts with the page.
        // A normal first click/tap/keypress in the emulator will retry playback.
      }
    }

    function wakeAudio() {
      if (!audioPlaying) void tryStartAudio();
    }

    audio.addEventListener("playing", () => { audioPlaying = true; });
    audio.addEventListener("pause", () => { audioPlaying = false; });
    void tryStartAudio();

    window.addEventListener("pointerdown", wakeAudio, { passive: true });
    window.addEventListener("keydown", wakeAudio);

    // noVNC runs same-origin through the gateway; use the user's normal interaction
    // with the emulator screen to unlock audio without adding a separate Play button.
    frame.addEventListener("load", () => {
      void tryStartAudio();
      try {
        const remoteDocument = frame.contentDocument;
        if (remoteDocument) {
          remoteDocument.addEventListener("pointerdown", wakeAudio, true);
          remoteDocument.addEventListener("touchstart", wakeAudio, true);
          remoteDocument.addEventListener("keydown", wakeAudio, true);
        }
      } catch (_) {}
    });
  </script>
</body>
</html>
